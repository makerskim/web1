<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 사용량</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="panel" class="panel">
      <header class="top">
        <span class="app-title">AI 사용량</span>
        <span id="checked" class="checked"></span>
        <button id="refresh" class="icon-btn" type="button" title="지금 새로고침" aria-label="지금 새로고침">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" /></svg>
        </button>
        <button id="pin" class="icon-btn pin" type="button" aria-label="맨 위 고정" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2h4l-.6 4.2L12 8.5v1H4v-1l2.6-2.3zM8 9.5V14" /></svg>
        </button>
        <button id="open-settings" class="icon-btn" type="button" title="설정" aria-label="설정">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h12M2 11.5h12" /><circle cx="5.5" cy="4.5" r="1.7" class="knob" /><circle cx="10.5" cy="11.5" r="1.7" class="knob" /></svg>
        </button>
        <button id="close" class="icon-btn" type="button" title="닫기" aria-label="닫기">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
        </button>
      </header>

      <main id="list" aria-live="polite">
        <p class="loading">사용량을 확인하는 중이에요</p>
      </main>

      <section id="settings" class="settings" aria-labelledby="settings-title" hidden>
        <div class="settings-head">
          <h2 id="settings-title">설정</h2>
          <button id="close-settings" class="btn" type="button">완료</button>
        </div>

        <div id="accounts"></div>

        <label class="row">
          <span class="row-title">화면 위치</span>
          <select id="s-dock">
            <option value="top-right">오른쪽 위</option>
            <option value="bottom-right">오른쪽 아래</option>
          </select>
        </label>

        <label class="row">
          <span class="row-title">맨 위 고정 (다른 창에 안 가려짐)</span>
          <input id="s-top" type="checkbox" class="switch" />
        </label>

        <label class="row">
          <span class="row-title">확인 간격</span>
          <select id="s-interval">
            <option value="30">30초</option>
            <option value="60">1분</option>
            <option value="120">2분</option>
            <option value="300">5분</option>
          </select>
        </label>

        <label class="row">
          <span class="row-title">한도 알림</span>
          <input id="s-notify" type="checkbox" class="switch" />
        </label>

        <div class="row">
          <span class="row-title">주의 / 위험 기준</span>
          <span class="pair">
            <label><input id="s-warn" type="number" min="10" max="99" step="1" aria-label="주의 기준 %" />%</label>
            <label><input id="s-danger" type="number" min="11" max="100" step="1" aria-label="위험 기준 %" />%</label>
          </span>
        </div>

        <label class="row">
          <span class="row-title">컴퓨터를 켜면 자동으로 시작</span>
          <input id="s-login" type="checkbox" class="switch" />
        </label>

        <label class="row">
          <span class="row-title">✕ 누르면</span>
          <select id="s-close">
            <option value="minimize">작업 표시줄로</option>
            <option value="tray">시계 옆으로 숨기기</option>
            <option value="quit">프로그램 끝내기</option>
          </select>
        </label>

        <p id="version" class="version"></p>
      </section>
    </div>

    <template id="provider-tpl">
      <section class="provider">
        <div class="p-head">
          <span class="p-dot" aria-hidden="true"></span>
          <h2 class="p-name"></h2>
          <span class="p-plan"></span>
        </div>
        <p class="p-note" hidden></p>
        <div class="p-windows"></div>
      </section>
    </template>

    <script src="format.js"></script>
    <script src="app.js"></script>
  </body>
</html>
