<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; script-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 사용량</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="app-title">AI 사용량</span>
    </header>

    <main id="list" aria-live="polite">
      <p class="loading">사용량을 확인하는 중이에요</p>
    </main>

    <footer class="bar">
      <span id="checked" class="checked">아직 확인 전</span>
      <button id="refresh" class="btn" type="button">새로고침</button>
      <button id="open-settings" class="btn" type="button" aria-haspopup="dialog">설정</button>
    </footer>

    <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="sheet-inner">
        <div class="sheet-head">
          <h2 id="sheet-title">설정</h2>
          <button id="close-settings" class="btn" type="button">닫기</button>
        </div>

        <div id="accounts"></div>

        <label class="row">
          <span>
            <span class="row-title">확인 간격</span>
            <span class="row-help">이 간격마다 한도를 새로 확인해요</span>
          </span>
          <select id="s-interval">
            <option value="30">30초</option>
            <option value="60">1분</option>
            <option value="120">2분</option>
            <option value="300">5분</option>
          </select>
        </label>

        <label class="row">
          <span>
            <span class="row-title">한도 알림</span>
            <span class="row-help">아래 비율을 넘으면 Windows 알림을 띄워요</span>
          </span>
          <input id="s-notify" type="checkbox" class="switch" />
        </label>

        <div class="row">
          <span>
            <span class="row-title">주의 / 위험 기준</span>
            <span class="row-help">막대 색도 이 기준으로 바뀌어요</span>
          </span>
          <span class="pair">
            <label><input id="s-warn" type="number" min="10" max="99" step="1" aria-label="주의 기준 %" />%</label>
            <label><input id="s-danger" type="number" min="11" max="100" step="1" aria-label="위험 기준 %" />%</label>
          </span>
        </div>

        <label class="row">
          <span>
            <span class="row-title">컴퓨터를 켜면 자동으로 시작</span>
            <span class="row-help">창을 띄우지 않고 작업 표시줄에서 기다려요</span>
          </span>
          <input id="s-login" type="checkbox" class="switch" />
        </label>

        <label class="row">
          <span>
            <span class="row-title">창을 항상 위에 두기</span>
            <span class="row-help">다른 창을 열어도 이 창이 가려지지 않아요</span>
          </span>
          <input id="s-top" type="checkbox" class="switch" />
        </label>

        <label class="row">
          <span>
            <span class="row-title">창의 닫기(✕)를 누르면</span>
            <span class="row-help">어느 쪽이든 바탕화면 아이콘을 누르면 다시 열려요</span>
          </span>
          <select id="s-close">
            <option value="minimize">작업 표시줄로 내리기</option>
            <option value="tray">시계 옆 아이콘으로 숨기기</option>
            <option value="quit">프로그램 끝내기</option>
          </select>
        </label>

        <p id="version" class="version"></p>
      </div>
    </div>

    <template id="provider-tpl">
      <section class="provider">
        <div class="p-head">
          <h2 class="p-name"></h2>
          <span class="p-plan"></span>
          <span class="p-fresh"></span>
        </div>
        <p class="p-note" hidden></p>
        <div class="p-windows"></div>
        <dl class="p-stats" hidden>
          <div><dt>오늘 토큰</dt><dd class="s-tokens"></dd></div>
          <div><dt>오늘 응답</dt><dd class="s-replies"></dd></div>
        </dl>
      </section>
    </template>

    <script src="format.js"></script>
    <script src="app.js"></script>
  </body>
</html>
